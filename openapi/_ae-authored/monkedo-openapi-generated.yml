components:
  schemas:
    PostApiApiKeysInputOptionsRequest:
      type: object
      properties:
        componentId:
          type: string
          description: Component id — e.g. action.cubicl.get-tasks
        inputName:
          type: string
          description: Input whose options you want — e.g. group
        inputs:
          type: object
          description: Values of inputs that appear before inputName in the component form
        search:
          type: string
          description: Filter text for searchable option lists
      required:
      - componentId
      - inputName
    PostApiApiKeysInputOptionsResponse:
      type: object
      properties:
        value:
          type: string
          description: Option value.
        label:
          type: string
          description: Option label.
        desc:
          type: string
          description: Option description.
    GetApiV1ComponentsAppsResponse:
      type: object
      properties:
        name:
          type: string
          description: App name.
        icon:
          type: string
          description: Icon filename.
        key:
          type: string
          description: App key.
    GetApiV1ComponentsTriggersResponse:
      type: object
      properties:
        _id:
          type: string
          description: Trigger record id.
        componentId:
          type: string
          description: Trigger component id.
        inputs:
          type: object
          description: Trigger inputs.
        createdAt:
          type: string
          description: Creation timestamp.
        webhookUrl:
          type: string
          description: Webhook URL for events.
    PostApiV1ComponentsTriggersRequest:
      type: object
      properties:
        componentKey:
          type: string
          description: Trigger component id — e.g. trigger.cubicl.task-archived or trigger.email
        webhookUrl:
          type: string
          description: Absolute public HTTP(S) URL. Localhost and private IPs are rejected.
        inputs:
          type: object
          description: Trigger register parameters (varies by component).
      required:
      - componentKey
      - webhookUrl
    PostApiV1ComponentsTriggersResponse:
      type: object
      properties:
        triggerId:
          type: string
          description: Created trigger identifier.
    PostApiV1FilesUploadLinkRequest:
      type: object
      properties:
        name:
          type: string
          description: File name including extension. Cannot contain /, \, or :.
      required:
      - name
    PostApiV1FilesUploadLinkResponse:
      type: object
      properties:
        fileId:
          type: string
          description: Reserved file identifier.
        s3Name:
          type: string
          description: S3 object name.
        uploadUrl:
          type: string
          description: Presigned URL for uploading the file.
    PostListenRequest:
      type: object
      properties:
        componentKey:
          type: string
        webhookUrl:
          type: string
        inputs:
          type: object
          properties:
            group:
              type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: Api
- name: Listen
